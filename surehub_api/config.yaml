name: SureHub API
version: "0.2.0"
slug: surehub_api
description: Unofficial Sure Petcare REST API bridge
url: "https://github.com/ASTPlatinum/home-assistant-surehub-api-addon"
arch:
  - amd64
startup: services
boot: auto
init: false
build_from:
  amd64: ghcr.io/home-assistant/amd64-base:latest
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: SureHub API web interface
options:
  email: ""
  password: ""
  endpoint: "https://app-api.production.surehub.io"
  host: "0.0.0.0"
  port: 3001
  loglevel: "info"
schema:
  email: str
  password: password
  endpoint: str
  host: str
  port: int
  loglevel: list(critical|error|warning|info|debug|trace)